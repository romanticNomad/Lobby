[workspace]
resolver = "3"

members = [
    "benchmarks",
    "chaos-tests",
    "client",
    "component-tests",
    "e2e-tests",
    "integration-tests",
    "invariant-tests",
    "test-utils"
]

[workspace.dependencies]
# Core Lobby dependencies (imported from ../ensemble)
lobby-kernel = { path = "../ensemble/crate/kernel" }
lobby-actors = { path = "../ensemble/crate/actors" }
lobby-cortex = { path = "../ensemble/crate/cortex" }
lobby-utils = { path = "../ensemble/crate/utils" }

# Testing frameworks
tokio = { version = "1.40", features = ["full", "test-util"] }
tokio-test = "0.4"
rstest = "0.23"
mockall = "0.13"
wiremock = "0.6"
proptest = "1.5"
quickcheck = "1.0"

# Database testing
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# Blockchain testing
alloy = { version = "0.8", features = ["full"] }
foundry-config = "0.2"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Utilities
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
hex = "0.4"
rand = "0.8"
