[package]
name = "actors"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
] }
tokio = { version = "1", features = ["full"] }
alloy-primitives = {version = "1.5.2", features = ["serde"]}
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
kernel = { path = "../kernel" }
props = { path = "../props" }
