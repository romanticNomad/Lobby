[package]
name = "cortex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
kernel = { path = "../kernel" }
alloy = { version = "1.6.0", features = ["full"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version ="1.19", features = ["v4", "serde"] }
rand = "0.8"
serde_json = "1.0.149"
dashmap = "6.1.0"
axum = "0.8.8"
thiserror = "2.0.18"
tracing = "0.1"
