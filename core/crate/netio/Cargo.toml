[package]
name = "netio"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
kernel = {path = "../kernel"}
utils = {path = "../utils"}
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
  "bigdecimal",
] }
alloy = { version = "1.6.0", features = ["full"] }
async-trait = "0.1.89"
tokio = { version = "1", features = ["full"] }
uuid = { version ="1.19", features = ["v4"] }
tracing = "0.1.44"
serde_json = "1.0.149"
