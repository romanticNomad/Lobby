[package]
name = "netio"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
] }
alloy = { version = "1.6.0", features = ["full"] }
async-trait = "0.1.89"
tokio = { version = "1", features = ["full"] }
kernel = {path = "../kernel"}
uuid = { version ="1.19", features = ["v4"] }
tracing = "0.1.44"
