[package]
name = "actors"
version = "0.1.0"
edition = "2024"

[dependencies]
kernel = { path = "../kernel" }
utils = { path = "../utils" }
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"
alloy = { version = "1.6.0", features = ["full"] }
dashmap = "6.1.0"
