[package]
name = "utils"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
kernel = { path = "../kernel" }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
zeroize = "1.8.2"
rlp = "0.6.1"
hex-literal = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
hex = "0.4"
alloy = { version = "1.6.0", features = ["full"] }
