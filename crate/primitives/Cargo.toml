[package]
name = "primitives"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
] }
uuid = { version ="1.19", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
alloy = { version = "1.6.0", features = ["full"] }
rlp = "0.6.1"
serde_json = "1.0.149"
dashmap = "6.1.0"
thiserror = "2.0.18"
async-trait = "0.1.89"
