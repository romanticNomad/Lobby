services:
  postgres:
    image: postgres:16
    container_name: lobby-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby_dev_password
      POSTGRES_DB: lobby-db
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - lobby_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lobby_pgdata:
