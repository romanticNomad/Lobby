[package]
name = "actors"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
kernel = { path = "../kernel" }
utils = { path = "../utils" }
alloy = { version = "1.6.0", features = ["full"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "bigdecimal",] }
async-trait = "0.1.89"
tracing = "0.1"
serde_json = "1.0.149"
