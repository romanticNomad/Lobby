services:
  postgres:
    image: postgres:18.3
    container_name: lobby-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby_dev_password
      POSTGRES_DB: lobby-db
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - lobby_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    container_name: lobby-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - lobby_redis_data:/data

    # AOF persistence (crash-safe)
    command: redis-server --appendonly yes --appendfsync everysec

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RedisInsight (GUI for debugging Redis)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: lobby-redis-insight
    restart: unless-stopped
    
    ports:
      - "5540:5540"
    
    volumes:
      - lobby_redisinsight_data:/data
    
    depends_on:
      - redis

volumes:
  lobby_pgdata:
  lobby_redis_data:
  lobby_redisinsight_data: